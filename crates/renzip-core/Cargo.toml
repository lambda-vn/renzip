[package]
name = "renzip-core"
description = "Reader and writer for Ren'Py .rpa archives"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde-pickle = "1.2.0"
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
